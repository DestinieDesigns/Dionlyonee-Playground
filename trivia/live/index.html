<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trivia Live Broadcast | Dionlyonee Stream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../css/trivia.css" />
  <link rel="stylesheet" href="trivia-live.css" />
</head>
<body>
  <header class="main-header">
    <div class="brand">
      <div class="brand-icon" style="background: linear-gradient(135deg, #a855f7, #6366f1); color: #fff;">⚡</div>
      <div>
        <div class="brand-title">TRIVIA SHOWDOWN</div>
        <div class="brand-tag">AUDIENCE LIVE STAGE</div>
      </div>
    </div>
    <div id="header-hud"></div>
  </header>

  <main class="hub-container">
    <div id="buzzer-banner" style="
      display: none; padding: 14px; border-radius: 12px;
      background: rgba(244, 63, 94, 0.2); border: 2px solid #f43f5e;
      color: #fff; text-align: center; font-family: 'Cinzel', serif; font-size: 20px; font-weight: 900;
    ">
      🚨 <span id="buzzer-player-name">CO-HOST</span> BUZZED IN!
    </div>

    <div id="live-question-card"></div>

    <div class="trivia-timer-bar">
      <div id="live-timer-fill" class="trivia-timer-fill"></div>
    </div>

    <div style="margin-top: 32px;">
      <h3 style="font-family: 'Cinzel', serif; font-size: 16px; color: #94a3b8; margin-bottom: 12px;">
        CONTESTANT STANDINGS
      </h3>
      <div id="live-contestants-row" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;"></div>
    </div>
  </main>

  <script src="../../shared/sound-manager.js"></script>
  <script src="../../shared/room-manager.js"></script>
  <script src="../../shared/firebase-room.js"></script>
  <script src="../../shared/room-ui.js"></script>
  <script src="../../shared/contestant-manager.js"></script>
  <script src="../js/trivia-ui.js"></script>
  <script src="trivia-live.js"></script>
</body>
</html>
