<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dionlyonee — Sync Test</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    font-family: Arial, Helvetica, sans-serif;
    background: radial-gradient(circle at 50% 15%, #16383a 0%, #0b1d1e 30%, #020303 100%);
    color: #fff;
  }
  h1 { font-size: 20px; letter-spacing: 1px; color: #d4af37; }
  #counter {
    font-size: 72px;
    font-weight: 900;
    min-width: 160px;
    text-align: center;
  }
  .row { display: flex; gap: 12px; }
  button {
    padding: 14px 24px;
    font-size: 16px;
    font-weight: 800;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: linear-gradient(135deg, #d4af37, #8c7322);
    color: #07090e;
  }
  #role-info { font-size: 13px; color: #94a3b8; }
  .host-header { display: flex; gap: 10px; align-items: center; }
</style>
</head>
<body>

<div class="host-header"></div>
<h1>SYNC TEST — open this page in two tabs/devices</h1>
<div id="counter">0</div>
<div class="row">
  <button id="minus">−1</button>
  <button id="plus">+1</button>
  <button id="unlock-host">Unlock Host</button>
</div>
<div id="role-info">room: loading...</div>

<script type="module">
  import { RoomSync } from '../shared/session-manager.js';

  const counterEl = document.getElementById('counter');
  const roleInfo = document.getElementById('role-info');

  RoomSync.setGameType('sync-test');
  RoomSync.attachRoomHUD('.host-header');
  roleInfo.textContent = `room: ${RoomSync.roomId} — host unlocked: ${RoomSync.isHostUnlocked()}`;

  let count = 0;

  RoomSync.onStateChange((state) => {
    if (typeof state.count === 'number') {
      count = state.count;
      counterEl.textContent = count;
    }
  });

  document.getElementById('plus').addEventListener('click', () => {
    count += 1;
    counterEl.textContent = count;
    RoomSync.sendState({ count });
  });

  document.getElementById('minus').addEventListener('click', () => {
    count -= 1;
    counterEl.textContent = count;
    RoomSync.sendState({ count });
  });

  document.getElementById('unlock-host').addEventListener('click', () => {
    RoomSync.ensureHostPasscodeUnlocked(() => {
      roleInfo.textContent = `room: ${RoomSync.roomId} — host unlocked: true`;
    });
  });
</script>

</body>
</html>
