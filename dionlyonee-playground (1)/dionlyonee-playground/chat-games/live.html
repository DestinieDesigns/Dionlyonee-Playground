<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dionlyonee Playground — Game Center (LIVE)</title>
<link rel="stylesheet" href="chat-games.css">
</head>
<body>

<header class="cg-header">
  <div class="cg-brand">
    <div class="cg-logo">D</div>
    <div>
      <div class="cg-brand-name">DIONLYONEE GAME CENTER</div>
      <div class="cg-brand-sub">CHAT GAMES</div>
    </div>
  </div>
  <div class="cg-live-badge"><span class="cg-live-dot"></span>LIVE</div>
</header>

<main class="cg-live-main">
  <div class="cg-live-stage" id="cg-live-stage">
    <div class="cg-waiting">
      <div class="cg-waiting-icon">🎮</div>
      <div class="cg-waiting-title">WAITING FOR THE HOST</div>
      <div class="cg-waiting-sub">The next game starts any moment now...</div>
    </div>
  </div>
</main>

<script type="module" src="live.js"></script>

</body>
</html>
