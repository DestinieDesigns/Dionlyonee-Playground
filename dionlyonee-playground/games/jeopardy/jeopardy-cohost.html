<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dionlyonee Playground — Jeopardy COHOST</title>
<link rel="stylesheet" href="jeopardy.css">
</head>
<body>

<header class="jeo-header cohost-header">
  <div class="jeo-brand">
    <div class="jeo-logo">D</div>
    <div>
      <div class="jeo-brand-name">DIONLYONEE PLAYGROUND</div>
      <div class="jeo-brand-sub">JEOPARDY — COHOST</div>
    </div>
  </div>
</header>

<p style="text-align:center; font-size:12px; color:#94a3b8; padding: 10px 20px 0;">
  Ask the Host for the room code, then use the ✏️ icon above to join it.
</p>

<main class="jeo-main">

  <section id="setup-panel" class="panel">
    <h2>GAME SETUP</h2>
    <form id="setup-form" class="setup-form">
      <input type="text" id="player1" placeholder="Player 1 name" value="Player 1" required>
      <input type="text" id="player2" placeholder="Player 2 name (optional)">
      <input type="text" id="player3" placeholder="Player 3 name (optional)">
      <button type="submit" class="btn-primary">START GAME</button>
    </form>
  </section>

  <section id="game-panel" style="display:none;">

    <div class="panel">
      <div id="message-banner" class="message-banner">Ready.</div>
      <div id="players-row" class="players-row"></div>
    </div>

    <div id="board-panel" class="panel">
      <h2>BOARD</h2>
      <div id="jeo-board" class="jeo-board"></div>
    </div>

    <div id="clue-panel" class="panel" style="display:none;">
      <div id="clue-value" class="jeo-clue-value">FOR $—</div>
      <div id="clue-cat" class="jeo-clue-cat">—</div>
      <div id="clue-text" class="jeo-clue-text">—</div>
      <div id="clue-answer" class="jeo-answer-text" style="display:none;"></div>

      <div id="buzz-controls" class="controls-row"></div>

      <div id="judge-controls" class="controls-row" style="display:none;">
        <button id="btn-correct" class="btn-correct">✅ CORRECT</button>
        <button id="btn-wrong" class="btn-wrong">❌ WRONG</button>
      </div>

      <div class="controls-row">
        <button id="btn-no-one" class="btn-secondary">NO ONE GOT IT</button>
      </div>
    </div>

  </section>

</main>

<script type="module" src="jeopardy-cohost.js"></script>

</body>
</html>
