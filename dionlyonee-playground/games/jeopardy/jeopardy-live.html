<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dionlyonee Playground — Jeopardy LIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="jeopardy.css">
<link rel="stylesheet" href="../../shared/waiting-scene.css">
</head>
<body class="live-page">

<header class="jeo-header live-header">
  <div class="jeo-brand">
    <div class="jeo-logo">D</div>
    <div>
      <div class="jeo-brand-name">DIONLYONEE PLAYGROUND</div>
      <div class="jeo-brand-sub">JEOPARDY</div>
    </div>
  </div>
  <div class="jeo-live-badge"><span class="jeo-live-dot"></span>LIVE</div>
</header>

<main class="jeo-main">
  <div id="waiting-scene-container"></div>

  <div id="game-section" style="display:none;">
    <section class="panel">
      <div id="message-banner" class="message-banner">Waiting for the host...</div>
      <div id="players-row" class="players-row"></div>
    </section>

    <section id="board-panel" class="panel">
      <div id="jeo-board" class="jeo-board"></div>
    </section>

    <section id="clue-panel" class="panel" style="display:none;">
      <div id="clue-value" class="jeo-clue-value">FOR $—</div>
      <div id="clue-cat" class="jeo-clue-cat">—</div>
      <div id="clue-text" class="jeo-clue-text">—</div>
    </section>
  </div>
</main>

<footer class="live-footer">DIONLYONEE PLAYGROUND ◆ JEOPARDY</footer>

<div id="dramatic-banner" class="dramatic-banner">
  <div class="text" id="dramatic-text"></div>
</div>

<script type="module" src="jeopardy-live.js"></script>

</body>
</html>
