<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dionlyonee Playground — Wheel COHOST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wheel.css">
</head>
<body>

<header class="wheel-header cohost-header">
  <div class="wheel-brand">
    <div class="wheel-logo">D</div>
    <div>
      <div class="wheel-brand-name">DIONLYONEE PLAYGROUND</div>
      <div class="wheel-brand-sub">WHEEL OF FORTUNE — COHOST</div>
    </div>
  </div>
</header>

<p style="text-align:center; font-size:12px; color:#94a3b8; padding: 10px 20px 0;">
  Ask the Host for the room code, then use the ✏️ icon above to join it.
</p>

<main class="wheel-main host-layout">

  <section id="setup-panel" class="panel">
    <h2>GAME SETUP</h2>
    <form id="setup-form" class="setup-form">
      <input type="text" id="player1" placeholder="Player 1 name" value="Player 1" required>
      <input type="text" id="player2" placeholder="Player 2 name (optional)">
      <input type="text" id="player3" placeholder="Player 3 name (optional)">
      <select id="category-select">
        <option value="">Random category</option>
      </select>
      <button type="submit" class="btn-primary">START GAME</button>
    </form>
  </section>

  <section id="game-panel" class="panel" style="display:none;">
    <h2>GAME CONTROL</h2>

    <div class="category-label">CATEGORY</div>
    <div id="category-display" class="category-value">—</div>

    <div id="message-banner" class="message-banner">Ready.</div>

    <div id="puzzle-board" class="puzzle-board"></div>

    <div id="players-row" class="players-row"></div>

    <div class="controls-row">
      <button id="btn-spin" class="btn-primary" disabled>SPIN THE WHEEL</button>
      <button id="btn-solve-toggle" class="btn-secondary" disabled>ATTEMPT SOLVE</button>
      <button id="btn-next-puzzle" class="btn-secondary">NEXT PUZZLE</button>
    </div>

    <div id="solve-form-wrap" class="solve-form" style="display:none;">
      <input type="text" id="solve-input" placeholder="Type the player's solve attempt...">
      <button id="btn-submit-solve" class="btn-primary">SUBMIT</button>
    </div>

    <div id="letter-panel" style="display:none;">
      <div id="letter-grid" class="letter-grid"></div>
    </div>
  </section>

  <section class="panel">
    <h2>WHEEL</h2>
    <div class="wheel-wrap">
      <div class="wheel-pointer"></div>
      <canvas id="wheel-canvas" width="360" height="360"></canvas>
    </div>
    <div id="wedge-display" style="text-align:center;font-weight:800;color:#f7e07d;">—</div>
  </section>

</main>

<script src="wheel-engine.js"></script>
<script src="wheel-puzzles.js"></script>
<script type="module" src="wheel-cohost.js"></script>

</body>
</html>
