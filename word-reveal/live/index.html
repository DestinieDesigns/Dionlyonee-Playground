<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Reveal Live | Dionlyonee Stream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../css/word-reveal.css" />
  <link rel="stylesheet" href="../css/word-animations.css" />
  <link rel="stylesheet" href="word-live.css" />
</head>
<body>
  <header class="main-header">
    <div class="brand">
      <div class="brand-icon" style="background: linear-gradient(135deg, #10b981, #047857); color: #fff;">🔤</div>
      <div>
        <div class="brand-title">WORD REVEAL SHOW</div>
        <div class="brand-tag">AUDIENCE LIVE STAGE</div>
      </div>
    </div>
    <div id="header-hud"></div>
  </header>

  <main class="hub-container" style="text-align: center;">
    <div id="live-cat-badge" style="
      display: inline-block; padding: 6px 16px; border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399; font-size: 12px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
      margin-bottom: 24px;
    ">
      CATEGORY
    </div>

    <!-- Audience Animated Letter Cards -->
    <div class="word-tiles-wrap" id="live-tiles-grid"></div>

    <div id="live-hint-container" style="max-width: 500px; margin: 0 auto 32px auto;"></div>

    <div>
      <h3 style="font-family: 'Cinzel', serif; font-size: 16px; color: #94a3b8; margin-bottom: 12px;">
        CONTESTANT SCORES
      </h3>
      <div id="live-contestants-row" style="display: flex; gap: 16px; justify-content: center;"></div>
    </div>
  </main>

  <script src="../../shared/sound-manager.js"></script>
  <script src="../../shared/room-manager.js"></script>
  <script src="../../shared/firebase-room.js"></script>
  <script src="../../shared/room-ui.js"></script>
  <script src="../../shared/contestant-manager.js"></script>
  <script src="../js/reveal-engine.js"></script>
  <script src="../js/hint-engine.js"></script>
  <script src="word-live.js"></script>
</body>
</html>
