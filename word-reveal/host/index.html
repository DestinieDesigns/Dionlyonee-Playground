<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Reveal Host | Dionlyonee Stream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../css/word-reveal.css" />
  <link rel="stylesheet" href="word-host.css" />
</head>
<body>
  <header class="main-header">
    <a href="../index.html" class="brand">
      <div class="brand-icon" style="background: linear-gradient(135deg, #10b981, #047857); color: #fff;">🔤</div>
      <div>
        <div class="brand-title">WORD REVEAL</div>
        <div class="brand-tag">HOST CONSOLE</div>
      </div>
    </a>
    <div id="header-hud"></div>
  </header>

  <main class="hub-container">
    <div class="dion-card" style="margin-bottom: 24px;">
      <div style="font-size: 12px; font-weight: 800; color: #34d399; letter-spacing: 2px;">
        CURRENT PHRASE / WORD
      </div>
      <h2 id="host-phrase-display" style="font-family: 'Cinzel', serif; font-size: 26px; color: #fff; margin: 8px 0;">
        LOADING PHRASE...
      </h2>
      <div id="host-hint-box" style="margin-top: 10px;"></div>
    </div>

    <!-- Letter Grid Preview -->
    <div class="word-tiles-wrap" id="host-tiles-grid"></div>

    <div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 32px;">
      <button id="btn-reveal-one" class="dion-btn dion-btn-gold">
        🔤 REVEAL 1 LETTER
      </button>
      <button id="btn-reveal-all" class="dion-btn dion-btn-secondary">
        ✨ REVEAL FULL PHRASE
      </button>
      <button id="btn-next-phrase" class="dion-btn dion-btn-primary">
        ⏩ NEXT PHRASE
      </button>
      <button id="btn-buzz-correct" style="
        padding: 12px 24px; border-radius: 10px; background: #10b981; color: #07090e; font-weight: 800; cursor: pointer;
      ">
        ✓ CORRECT SOLVE
      </button>
    </div>

    <div style="max-width: 600px; margin: 0 auto;">
      <h3 style="font-family: 'Cinzel', serif; font-size: 16px; margin-bottom: 12px; color: #94a3b8;">
        CONTESTANT SCORES
      </h3>
      <div id="host-contestants-list"></div>
    </div>
  </main>

  <script src="../../shared/sound-manager.js"></script>
  <script src="../../shared/room-manager.js"></script>
  <script src="../../shared/firebase-room.js"></script>
  <script src="../../shared/host-auth.js"></script>
  <script src="../../shared/room-ui.js"></script>
  <script src="../../shared/contestant-manager.js"></script>
  <script src="../data/words.js"></script>
  <script src="../data/phrases.js"></script>
  <script src="../data/hints.js"></script>
  <script src="../js/word-engine.js"></script>
  <script src="../js/reveal-engine.js"></script>
  <script src="../js/hint-engine.js"></script>
  <script src="word-host.js"></script>
</body>
</html>
