<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stage - DIONLYONEE SPEAK OUT!</title>
  <link rel="stylesheet" href="../css/speak-common.css">
  <link rel="stylesheet" href="speak-live.css">
</head>
<body>
  <div class="live-bg-glow"></div>

  <div class="live-container" id="liveApp">
    <!-- Broadcast Top HUD -->
    <header class="live-header" id="liveHeader">
      <div class="live-brand">
        <span>🎤</span> DIONLYONEE SPEAK OUT!
      </div>

      <div class="live-metrics">
        <div class="live-metric-box">
          <span class="label">Total Score</span>
          <span class="val" id="liveScoreVal" style="color: var(--gold);">0</span>
        </div>
        <div class="live-metric-box" id="liveStreakBox">
          <span class="label">Streak</span>
          <span class="val" id="liveStreakVal" style="color: #f43f5e;">0 🔥</span>
        </div>
        <div class="live-metric-box">
          <span class="label">Room Code</span>
          <span class="val" id="liveRoomVal" style="color: #38bdf8; font-size: 1.5rem;">----</span>
        </div>
      </div>
    </header>

    <!-- Main Stage Center Arena -->
    <main class="live-main-stage" id="liveArena">
      <div class="live-mode-banner" id="liveModeBanner">
        <span id="liveModeIcon">👅</span>
        <span id="liveModeName">TONGUE TWISTER</span>
      </div>

      <div class="live-prompt-instruction" id="liveInstruction">
        REPEAT 3 TIMES CLEARLY
      </div>

      <h1 class="live-prompt-headline" id="liveHeadline">
        Waiting for Host to start...
      </h1>

      <!-- Forbidden Words List on Live Screen -->
      <div class="live-forbidden-grid" id="liveForbiddenGrid" style="display: none;"></div>

      <!-- Synchronized Timer Float -->
      <div class="live-timer-float" id="liveTimerFloat">
        <span style="font-size: 1.5rem;">⏱️</span>
        <span class="live-timer-num" id="liveTimerNum">20</span>
      </div>

      <!-- Revealed Answer Banner -->
      <div class="live-answer-reveal" id="liveAnswerReveal" style="display: none;"></div>
    </main>

    <!-- Bottom Stream Banner Toast for Action Celebrations -->
    <div id="liveBannerToast" class="live-banner-toast" style="display: none;">
      <span id="liveToastIcon">🔥</span>
      <span id="liveToastText">3X STREAK ON FIRE!</span>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../../shared/firebase-config.js"></script>
  <script src="../../shared/room-manager.js"></script>
  <script src="../../shared/firebase-room.js"></script>
  <script src="../../shared/game-session.js"></script>
  <script src="../../shared/sound-manager.js"></script>

  <!-- Data Libraries -->
  <script src="../data/tongue-twisters.js"></script>
  <script src="../data/rapid-fire.js"></script>
  <script src="../data/forbidden-words.js"></script>
  <script src="../data/voice-challenges.js"></script>
  <script src="../data/keep-talking.js"></script>
  <script src="../data/finish-the-phrase.js"></script>
  <script src="../data/speak-out-data.js"></script>

  <!-- Logic -->
  <script src="../js/speak-timer.js"></script>
  <script src="../js/streak-manager.js"></script>
  <script src="../js/speak-scoring.js"></script>
  <script src="../js/speak-randomizer.js"></script>
  <script src="../js/challenge-manager.js"></script>
  <script src="../js/speak-engine.js"></script>

  <!-- Live View Controller -->
  <script src="speak-live.js"></script>
</body>
</html>
